<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;background:#0b1220;color:#fff;margin:0;padding:24px}h1{font-size:34px;margin:12px 0}.muted{color:#9ca3af}.card{background:#111827;border:1px solid #263244;border-radius:18px;padding:18px;margin:14px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #334155;margin-top:10px;font-size:16px}button{background:#fff;color:#111827;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#182235;padding:16px;border-radius:14px}.ok{color:#34d399}</style></head><body><div class="muted">BUSINESS OPERATING SYSTEM</div><h1>BOS Mobile</h1><p class="muted">Early access control center</p><div class="card"><b>Connect to your BOS server</b><input id="url" placeholder="https://your-bos-domain.com" value=""><button onclick="connect()">Connect & Check Health</button><p id="status" class="muted">Not connected</p></div><div class="grid"><div class="tile"><b>AI Employees</b><br><span class="muted">Configure agents</span></div><div class="tile"><b>Automations</b><br><span class="muted">Run workflows</span></div><div class="tile"><b>Analytics</b><br><span class="muted">Track activity</span></div><div class="tile"><b>Billing</b><br><span class="muted">Manage plan</span></div></div><script>async function connect(){let u=document.getElementById('url').value.trim().replace(/\/$/,'');let s=document.getElementById('status');if(!u){s.textContent='Enter your BOS server URL';return}s.textContent='Checking…';try{let r=await fetch(u+'/health');let j=await r.json();s.innerHTML=r.ok?'<span class="ok">Connected · '+j.service+'</span>':'Health check failed'}catch(e){s.textContent='Connection failed: '+e.message}}</script></body></html>
