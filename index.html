<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOS — Business Operating System</title>
<meta name="description" content="BOS is a business operating system for AI-powered workflows and automation.">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f7f7f5; color: #111; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width: 760px; min-height: 100vh; margin: 0 auto; padding: 72px 24px; display: flex; flex-direction: column; justify-content: center; }
  .badge { display: inline-block; width: fit-content; padding: 7px 11px; border-radius: 999px; background: #111; color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  h1 { margin: 22px 0 8px; font-size: clamp(48px, 12vw, 82px); line-height: .95; letter-spacing: -.055em; }
  .subtitle { margin: 0 0 20px; font-size: clamp(22px, 5vw, 30px); font-weight: 650; letter-spacing: -.025em; }
  .description { max-width: 620px; margin: 0 0 18px; font-size: 19px; line-height: 1.55; color: #444; }
  .free { margin: 0 0 30px; font-size: 17px; font-weight: 750; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .button { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 20px; border-radius: 12px; text-decoration: none; font-weight: 750; font-size: 16px; }
  .primary { background: #111; color: #fff; }
  .secondary { background: #fff; color: #111; border: 1px solid #ddd; }
  .note { margin-top: 24px; color: #777; font-size: 13px; }
</style>
</head>
<body>
<main>
  <span class="badge">EARLY ACCESS</span>
  <h1>BOS</h1>
  <p class="subtitle">Business Operating System</p>
  <p class="description">Run business workflows, automations and AI employees from one operating layer.</p>
  <p class="free">Early customers can test BOS free.</p>
  <div class="actions">
    <a class="button primary" href="/dashboard">Launch BOS</a>
    <a class="button secondary" href="/workflows">Start Free Early Access</a>
  </div>
  <p class="note">No APK required. Start directly in your browser.</p>
</main>
</body>
</html>
