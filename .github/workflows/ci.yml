name: CI

on:
  push:
    branches:
      - main
      - mission-030-observability
      - phase-061-070-commercial-platform
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Commercial phase verification trigger
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d modules
          test -d agents
          test -d docs
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
      - name: Run repository test suite
        run: npm test
