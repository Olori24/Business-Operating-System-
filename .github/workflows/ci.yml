name: CI

on:
  push:
    branches:
      - main
      - mission-030-observability
      - phase-061-070-commercial-platform
      - mission/datafactor-70-score
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d modules
          test -d agents
          test -d docs
          test -f README.md
          test -f CHANGELOG.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f package-lock.json
          test -f jsconfig.json
          test -f .github/dependabot.yml
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run lint checks
        run: npm run lint
      - name: Run static typecheck gate
        run: npm run typecheck
      - name: Run repository test suite
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.log
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bos-test-output
          path: test-output.log
          if-no-files-found: error

  postgres-integration:
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL readiness
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U bos -d bos; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          docker compose logs postgres
          exit 1
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://bos:bos@localhost:5432/bos
        run: npm run test:integration
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
