name: CI

on:
  push:
    branches:
      - main
      - mission-030-observability
      - phase-061-070-commercial-platform
      - mission/datafactor-70-score
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  repository-check:
    name: Repository structure and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d modules
          test -d agents
          test -d docs
          test -f README.md
          test -f CHANGELOG.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f package-lock.json
          test -f jsconfig.json
          test -f .github/dependabot.yml
          test -f .env.example
      - name: Audit dependencies
        run: npm audit --audit-level=high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install from clean checkout
        run: npm ci --ignore-scripts
      - name: Verify .env example and Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/tmp/bos-compose-config.yml
          test -s /tmp/bos-compose-config.yml
      - name: Run repository tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bos-test-output
          path: test-output.log
          if-no-files-found: error

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Start PostgreSQL
        run: docker compose up -d postgres
      - name: Wait for PostgreSQL readiness
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U bos -d bos; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)..."
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          docker compose logs postgres
          exit 1
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgres://bos:bos@localhost:5432/bos
        run: npm run test:integration
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
