name: CI

on:
  push:
    branches:
      - main
      - mission-003-foundation
      - mission-004-runtime-foundation
      - mission-005-api-contract
      - mission-006-multitenant-foundation
      - mission-007-persistence-foundation
      - mission-008-auth-foundation
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d modules
          test -d agents
          test -d docs
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
      - name: Run runtime, domain, persistence, and auth tests
        run: npm test
