name: CI

on:
  push:
    branches:
      - main
      - mission-003-foundation
      - mission-004-runtime-foundation
      - mission-005-api-contract
      - mission-006-multitenant-foundation
      - mission-007-persistence-foundation
      - mission-008-auth-foundation
      - mission-009-authorization-enforcement
      - mission-010-business-domain-core
      - mission-011-workflow-engine
      - mission-012-queue-worker-engine
      - mission-013-scheduler-engine
      - mission-014-event-bus-work
      - mission-015-event-integration
      - mission-016-event-driven-queue-integration
      - mission-017-event-driven-scheduler-integration
      - mission-018-event-driven-workflow-orchestration-v2
      - mission-019-orchestration-reliability
  pull_request:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d modules
          test -d agents
          test -d docs
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
      - name: Run repository test suite
        run: npm test
