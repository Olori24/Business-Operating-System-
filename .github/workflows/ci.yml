name: CI

on:
  push:
    branches:
      - main
      - mission-030-observability
      - phase-061-070-commercial-platform
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository structure
        run: |
          test -d apps
          test -d packages
          test -d modules
          test -d agents
          test -d docs
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f package-lock.json

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run lint checks
        run: npm run lint

      - name: Run repository test suite
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.log

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bos-test-output
          path: test-output.log
          if-no-files-found: error
