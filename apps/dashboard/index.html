<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Start Free Early Access</title><style>body{font-family:system-ui;background:#070b14;color:#e8edf7;margin:0}.shell{max-width:760px;margin:auto;padding:28px}.card{background:#0d1320;border:1px solid #202a3d;border-radius:18px;padding:24px;margin-top:24px}input,select,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;border:1px solid #2a354a;background:#0b1220;color:#fff;font:inherit}button{background:#fff;color:#070b14;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#0d2b24}.err{background:#3a1720}.links{display:grid;gap:10px;margin-top:18px}.links a{display:block;padding:14px;border:1px solid #2a354a;border-radius:10px;color:#fff;text-decoration:none}</style></head><body><main class="shell"><p>BUSINESS OPERATING SYSTEM</p><h1>Start Free Early Access</h1><p>Create your real BOS workspace. Early customers get the platform free while we validate the product.</p><section class="card"><h2>Create your workspace</h2><form id="form"><input id="businessName" placeholder="Business name" required><input id="ownerName" placeholder="Your name" required><input id="email" type="email" placeholder="Business email" required><select id="industry" required><option value="">Industry</option><option>Real estate</option><option>Retail & e-commerce</option><option>Professional services</option><option>Logistics</option><option>Technology</option><option>Other</option></select><button>Create my free workspace</button></form><div id="msg" hidden></div><div id="links" class="links" hidden><a href="/workflows.html">Launch Workflow Builder →</a><a href="/dashboard">Open Workspace →</a></div></section></main><script>const f=document.querySelector('#form'),m=document.querySelector('#msg'),links=document.querySelector('#links');f.onsubmit=async e=>{e.preventDefault();m.hidden=false;m.className='msg';m.textContent='Creating workspace…';try{const r=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName:businessName.value,ownerName:ownerName.value,email:email.value,industry:industry.value})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||'Unable to create workspace');localStorage.setItem('bosTenantId',d.tenantId);m.textContent='Workspace created. Your free early-access account is ready.';links.hidden=false;f.querySelector('button').disabled=true}catch(err){m.className='msg err';m.textContent=err.message}};</script></body></html>
