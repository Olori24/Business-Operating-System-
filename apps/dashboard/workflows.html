<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Workflow Builder</title><style>body{font-family:system-ui;background:#070b14;color:#e8edf7;margin:0}.shell{max-width:980px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0d1320;border:1px solid #202a3d;border-radius:18px;padding:22px}input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #2a354a;background:#0b1220;color:#fff;font:inherit}button{background:#fff;color:#070b14;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#0d2b24}.err{background:#3a1720}.node{padding:14px;border:1px solid #2a354a;border-radius:10px;margin-top:10px}pre{white-space:pre-wrap;overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><p>BOS · WORKFLOW BUILDER</p><h1>Automate a real business process</h1><p>Create, persist and execute a workflow in your BOS workspace.</p><div class="grid"><section class="card"><h2>Workflow</h2><input id="name" placeholder="Lead follow-up"><select id="trigger"><option value="">Choose trigger</option><option>New lead</option><option>New customer</option><option>Form submission</option><option>Webhook received</option><option>Scheduled time</option></select><select id="action"><option value="">Choose action</option><option value="create_task">Create task</option><option value="notify_sales">Queue sales notification</option><option value="ai_followup">Queue AI follow-up</option></select><button id="run">Save & Run Workflow</button><div id="msg" hidden></div></section><section class="card"><h2>Execution</h2><div id="result">No execution yet.</div></section></div></main><script>const tenant=localStorage.getItem('bosTenantId');const msg=document.querySelector('#msg'),result=document.querySelector('#result');function show(t,e=false){msg.hidden=false;msg.className='msg'+(e?' err':'');msg.textContent=t}document.querySelector('#run').onclick=async()=>{if(!tenant)return show('Create your BOS workspace first.',true);const name=document.querySelector('#name').value.trim(),trigger=document.querySelector('#trigger').value,action=document.querySelector('#action').value;if(!name||!trigger||!action)return show('Complete all workflow fields.',true);const headers={'content-type':'application/json','x-tenant-id':tenant};try{show('Saving workflow…');const wr=await fetch('/api/v1/workflows',{method:'POST',headers,body:JSON.stringify({name,trigger:{type:trigger},steps:[{action,input:{workflowName:name,trigger}}]})});const wd=await wr.json();if(!wr.ok)throw Error(wd?.error?.message||'Workflow save failed');show('Workflow saved. Executing…');const er=await fetch('/api/v1/automations/run',{method:'POST',headers:{...headers,'idempotency-key':crypto.randomUUID()},body:JSON.stringify({workflowId:wd.workflow.id,context:{workflowName:name,trigger}})});const ed=await er.json();if(!er.ok)throw Error(ed?.error?.message||'Execution failed');result.innerHTML='<strong>Execution completed</strong><pre>'+JSON.stringify(ed.execution.result,null,2)+'</pre>';show('Workflow executed and persisted successfully.')}catch(e){show(e.message,true)}};</script></body></html>
