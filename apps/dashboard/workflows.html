<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Workflow Builder</title><style>body{font-family:system-ui;background:#070b14;color:#e8edf7;margin:0}.shell{max-width:980px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0d1320;border:1px solid #202a3d;border-radius:18px;padding:22px}input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #2a354a;background:#0b1220;color:#fff;font:inherit;box-sizing:border-box}button{background:#fff;color:#070b14;font-weight:800;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#0d2b24}.err{background:#3a1720}.workspace{margin-bottom:18px}.workspace[hidden]{display:none}.small{font-size:14px;color:#9aa7bd}pre{white-space:pre-wrap;overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="shell"><p>BOS · WORKFLOW BUILDER</p><h1>Automate a real business process</h1><p>Create, persist and execute a workflow in your BOS workspace.</p><section id="workspace" class="card workspace" hidden><h2>Set up your BOS workspace</h2><p class="small">You only need to do this once. Your workspace is saved in PostgreSQL.</p><input id="businessName" placeholder="Business name"><input id="ownerName" placeholder="Your name"><input id="email" type="email" placeholder="Business email"><button id="createWorkspace">Create Workspace & Continue</button><div id="workspaceMsg" hidden></div></section><div id="builder" class="grid" hidden><section class="card"><h2>Workflow</h2><input id="name" placeholder="Lead follow-up"><select id="trigger"><option value="">Choose trigger</option><option>New lead</option><option>New customer</option><option>Form submission</option><option>Webhook received</option><option>Scheduled time</option></select><select id="action"><option value="">Choose action</option><option value="create_task">Create task</option><option value="notify_sales">Queue sales notification</option><option value="ai_followup">Queue AI follow-up</option></select><button id="run">Save & Run Workflow</button><div id="msg" hidden></div></section><section class="card"><h2>Execution</h2><div id="result">No execution yet.</div></section></div></main><script>let tenant=localStorage.getItem('bosTenantId');const workspace=document.querySelector('#workspace'),builder=document.querySelector('#builder'),msg=document.querySelector('#msg'),workspaceMsg=document.querySelector('#workspaceMsg'),result=document.querySelector('#result');function show(el,t,e=false){el.hidden=false;el.className=e?'msg err':'msg';el.textContent=t}function render(){if(tenant){workspace.hidden=true;builder.hidden=false}else{workspace.hidden=false;builder.hidden=true}}document.querySelector('#createWorkspace').onclick=async()=>{const businessName=document.querySelector('#businessName').value.trim(),ownerName=document.querySelector('#ownerName').value.trim(),email=document.querySelector('#email').value.trim();if(!businessName||!ownerName||!email)return show(workspaceMsg,'Complete your business name, name and email.',true);try{show(workspaceMsg,'Creating your workspace…');const r=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName,ownerName,email})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||'Workspace creation failed');tenant=d.tenantId;localStorage.setItem('bosTenantId',tenant);localStorage.setItem('bosWorkspace',JSON.stringify(d.workspace));render();show(msg,'Workspace created. You can now build your first automation.')}catch(e){show(workspaceMsg,e.message,true)}};document.querySelector('#run').onclick=async()=>{if(!tenant)return render();const name=document.querySelector('#name').value.trim(),trigger=document.querySelector('#trigger').value,action=document.querySelector('#action').value;if(!name||!trigger||!action)return show(msg,'Complete all workflow fields.',true);const headers={'content-type':'application/json','x-tenant-id':tenant};try{show(msg,'Saving workflow…');const wr=await fetch('/api/v1/workflows',{method:'POST',headers,body:JSON.stringify({name,trigger:{type:trigger},steps:[{action,input:{workflowName:name,trigger}}]})});const wd=await wr.json();if(!wr.ok)throw Error(wd?.error?.message||'Workflow save failed');show(msg,'Workflow saved. Executing…');const er=await fetch('/api/v1/automations/run',{method:'POST',headers:{...headers,'idempotency-key':crypto.randomUUID()},body:JSON.stringify({workflowId:wd.workflow.id,context:{workflowName:name,trigger,action}})});const ed=await er.json();if(!er.ok)throw Error(ed?.error?.message||'Execution failed');result.innerHTML='<strong>Execution completed</strong><pre>'+JSON.stringify(ed.execution.result,null,2)+'</pre>';show(msg,'Workflow executed and persisted successfully.')}catch(e){show(msg,e.message,true)}};render();</script></body></html>
