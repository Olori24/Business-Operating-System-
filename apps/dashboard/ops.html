<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Operations</title><style>body{margin:0;background:#060a12;color:#f3f6fb;font:14px system-ui}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#070d17;border-right:1px solid #1c2a3f;padding:22px 14px}.brand{font-weight:900;padding:8px 10px 28px}.nav{display:grid;gap:4px}.nav a{color:#8f9caf;text-decoration:none;padding:11px 12px;border-radius:9px}.main{min-width:0}.top{height:70px;border-bottom:1px solid #1c2a3f;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top button{border:1px solid #2a3850;background:#101a2a;color:#fff;border-radius:9px;padding:9px 13px;font-weight:700}.content{padding:36px;max-width:1180px}.hero h1{font-size:clamp(38px,5vw,62px);letter-spacing:-.05em;margin:0 0 8px}.muted{color:#8997ad}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:26px 0}.card,.panel{background:#0b111d;border:1px solid #1c2a3f;border-radius:14px;padding:18px}.card small{display:block;color:#8997ad}.card strong{font-size:30px;display:block;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #18263a}.row:last-child{border-bottom:0}.status{color:#9fe6ca}.fail{color:#ff9eab}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:24px 16px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">BOS</div><nav class="nav"><a href="/dashboard">Overview</a><a href="/workflows">Workflows</a><a href="/integrations">Integrations</a><a href="/execution">Execution</a><a href="/analytics">Analytics</a><a href="/billing">Billing</a></nav></aside><main class="main"><header class="top"><span id="workspace">Business workspace</span><button id="logout">Log out</button></header><section class="content"><div class="hero"><h1>Operations at a glance.</h1><div class="muted">Live workspace data. No fabricated metrics.</div></div><div class="cards"><div class="card"><small>Active workflows</small><strong id="active">—</strong></div><div class="card"><small>Successful runs</small><strong id="success">—</strong></div><div class="card"><small>Failed runs</small><strong id="failed">—</strong></div><div class="card"><small>Queued runs</small><strong id="queued">—</strong></div><div class="card"><small>Integrations</small><strong id="integrations">—</strong></div></div><div class="grid"><section class="panel"><h2>Recent activity</h2><div id="activity" class="muted">Loading…</div></section><section class="panel"><h2>Notifications</h2><div id="notifications" class="muted">Loading…</div></section></div></section></main></div><script>const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}async function api(u){const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(r.status===401){location.href='/start';throw Error('Sign in required')}if(!r.ok)throw Error(d?.error?.message||'Request failed');return d}async function load(){try{const me=await api('/api/v1/auth/me');if(!me.workspace){location.href='/onboarding';return}$('workspace').textContent=me.workspace.businessName||'Business workspace';const d=await api('/api/v1/dashboard/summary');const m=d.metrics;$('active').textContent=m.activeWorkflows;$('success').textContent=m.successfulExecutions;$('failed').textContent=m.failedExecutions;$('queued').textContent=m.queuedExecutions;$('integrations').textContent=m.connectedIntegrations;$('activity').innerHTML=d.recentActivity.length?d.recentActivity.map(x=>`<div class="row"><span>${esc(x.action)}</span><span class="muted">${new Date(x.created_at).toLocaleString()}</span></div>`).join(''):'No activity yet.';$('notifications').innerHTML=d.notifications.length?d.notifications.map(x=>`<div class="row"><span>${esc(x.title)}</span><span class="${x.read_at?'muted':'status'}">${x.read_at?'Read':'New'}</span></div>`).join(''):'No notifications.'}catch(e){$('activity').textContent=e.message;$('notifications').textContent=e.message}}$('logout').onclick=async()=>{await fetch('/api/v1/auth/logout',{method:'POST'});location.href='/'};load();setInterval(load,30000);</script></body></html>
