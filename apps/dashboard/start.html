<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Start Free</title><style>body{margin:0;background:#070b14;color:#e8edf7;font-family:system-ui;padding:28px}.shell{max-width:760px;margin:auto;padding:40px 0}.card{background:#0d1320;border:1px solid #202a3d;border-radius:18px;padding:24px}.field{display:grid;gap:7px;margin:16px 0}label{font-size:13px;font-weight:700}input{padding:13px;border-radius:10px;border:1px solid #2a354a;background:#0b1220;color:#fff;font:inherit}button{padding:13px 18px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#070b14}.status{margin-top:16px;padding:12px;border-radius:10px;background:#172033}.error{background:#3a1720;color:#ffb4c0}a{color:#7dd3fc}</style></head><body><main class="shell"><p>EARLY ACCESS</p><h1>Start running your business with BOS.</h1><p>Set up your workspace, then build your first automation.</p><section class="card"><div class="field"><label>Business name</label><input id="business" placeholder="Your business"></div><div class="field"><label>Your name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@business.com"></div><button class="primary" id="start">Create my BOS workspace</button><div id="status" class="status" hidden></div></section></main><script>const s=document.querySelector('#status');function show(t,e=false){s.hidden=false;s.textContent=t;if(e)s.className='status error'}document.querySelector('#start').onclick=async()=>{const business=document.querySelector('#business').value.trim(),name=document.querySelector('#name').value.trim(),email=document.querySelector('#email').value.trim();if(!business||!name||!email){show('Please complete all fields.',true);return}const b=document.querySelector('#start');b.disabled=true;b.textContent='Creating workspace…';try{const r=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName:business,ownerName:name,email})});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Unable to create workspace');if(d.tenantId)localStorage.setItem('bos_tenant_id',d.tenantId);show('Workspace created. Opening BOS…');setTimeout(()=>location.href='/dashboard',500)}catch(e){show(e.message,true)}finally{b.disabled=false;b.textContent='Create my BOS workspace'}};</script></body></html>
