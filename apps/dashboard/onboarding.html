<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Start Free Early Access</title><style>:root{font-family:Inter,ui-sans-serif,system-ui;color:#f4f7fb;background:#060a12}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:70px 22px}.card{background:#0b111d;border:1px solid #1d2a40;border-radius:20px;padding:30px}.eyebrow{color:#9d91ff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1;letter-spacing:-.05em;margin:12px 0}p{color:#8e9bb0;line-height:1.6}.field{display:grid;gap:7px;margin-top:18px}label{font-size:12px;font-weight:750;color:#c8d1df}input{width:100%;padding:13px;border:1px solid #26364e;border-radius:10px;background:#08101b;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#f4f7fb;color:#070b12;font:inherit;font-weight:800;cursor:pointer}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#0d2b24;color:#91e8c7;font-size:13px}.error{background:#32141c;color:#ffb4c0}.next{display:none;margin-top:16px}.next a{color:#a99eff;font-weight:750;text-decoration:none}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">BOS Early Access</div><h1>Start running your business with BOS.</h1><p>Create a free workspace with just your business name and email. No Google account or complicated setup required.</p><form id="form"><div class="field"><label for="businessName">Business name</label><input id="businessName" required placeholder="e.g. EasytrustMart"></div><div class="field"><label for="email">Work email</label><input id="email" type="email" required placeholder="you@business.com"></div><button id="submit">Start Free Early Access</button></form><div id="msg" class="msg" role="status"></div><div id="next" class="next"><a href="/workflows">Open your BOS workspace →</a></div></section></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#msg'),next=document.querySelector('#next'),btn=document.querySelector('#submit');function show(text,error=false){msg.textContent=text;msg.className=error?'msg error':'msg';msg.style.display='block'}form.onsubmit=async e=>{e.preventDefault();const businessName=document.querySelector('#businessName').value.trim(),email=document.querySelector('#email').value.trim();if(!businessName||!email)return show('Enter your business name and email.',true);btn.disabled=true;btn.textContent='Creating workspace…';try{const r=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName,email})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||'Unable to create workspace');localStorage.setItem('bos_tenant_id',d.tenantId);localStorage.setItem('bosTenantId',d.tenantId);localStorage.setItem('bos_workspace',JSON.stringify(d.workspace));localStorage.setItem('bosWorkspace',JSON.stringify(d.workspace));show('Workspace created. Your BOS early-access account is ready.');next.style.display='block';form.style.display='none'}catch(err){show(err.message,true)}finally{btn.disabled=false;btn.textContent='Start Free Early Access'}};</script></body></html>
