<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Start Free Early Access</title><style>body{margin:0;background:#070b14;color:#e8edf7;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:0 auto;padding:48px 22px}.card{background:#0d1320;border:1px solid #263249;border-radius:18px;padding:28px}.eyebrow{color:#7dd3fc;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1;margin:10px 0 14px}p{color:#9aa8bd;line-height:1.55}.field{display:grid;gap:7px;margin-top:18px}label{font-size:13px;font-weight:700}input{padding:13px;border-radius:10px;border:1px solid #2b3850;background:#09111f;color:#fff;font:inherit}button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#07101d;font-weight:800;font-size:16px;cursor:pointer}.google{background:#fff;color:#111}.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#6f7d94;font-size:12px}.divider:before,.divider:after{content:"";height:1px;background:#263249;flex:1}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none;background:#103126;color:#91e8c7}.error{background:#3a1720;color:#ffb4c0}.next{display:none;margin-top:18px}.next a{color:#7dd3fc;font-weight:800}.small{font-size:12px;color:#718097}</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">BOS Early Access</div><h1>Put BOS to work.</h1><p>Create your free business workspace. Sign up with Google, then build your first automation and connect WhatsApp when you're ready.</p><div class="field"><label for="businessName">Business name</label><input id="businessName" required placeholder="e.g. EasytrustMart"></div><div id="googleButton" style="margin-top:16px"></div><p id="googleUnavailable" class="small" hidden>Google sign-in is not configured yet. Email signup remains available.</p><div class="divider">OR</div><form id="form"><div class="field"><label for="email">Work email</label><input id="email" type="email" required placeholder="you@business.com"></div><div class="field"><label for="ownerName">Your name</label><input id="ownerName" required placeholder="Your name"></div><button id="submit">Start Free Early Access</button></form><div id="msg" class="msg" role="status"></div><div id="next" class="next"><a href="/workflows">Build your first workflow →</a></div></div></main><script>
const businessName=document.querySelector('#businessName'),form=document.querySelector('#form'),msg=document.querySelector('#msg'),next=document.querySelector('#next'),btn=document.querySelector('#submit'),googleButton=document.querySelector('#googleButton'),googleUnavailable=document.querySelector('#googleUnavailable');
function show(t,e=false){msg.hidden=false;msg.textContent=t;msg.style.display='block';msg.className=e?'msg error':'msg'}
function finish(d){localStorage.setItem('bos_tenant_id',d.tenantId);localStorage.setItem('bosTenantId',d.tenantId);localStorage.setItem('bos_workspace',JSON.stringify(d.workspace));show('You are signed in. Your BOS workspace is ready.');next.style.display='block';form.style.display='none';googleButton.style.display='none'}
async function googleCredential(credential){const business=businessName.value.trim();if(!business){show('Enter your business name first.',true);return}googleButton.style.pointerEvents='none';try{const r=await fetch('/api/v1/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential,businessName:business})});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Google sign-in failed');finish(d)}catch(e){show(e.message,true)}finally{googleButton.style.pointerEvents='auto'}}
async function loadGoogle(){try{const r=await fetch('/api/v1/auth/google-config');if(!r.ok)throw new Error();const d=await r.json();const script=document.createElement('script');script.src='https://accounts.google.com/gsi/client';script.async=true;script.defer=true;script.onload=()=>{window.google.accounts.id.initialize({client_id:d.clientId,callback:(response)=>googleCredential(response.credential)});window.google.accounts.id.renderButton(googleButton,{theme:'outline',size:'large',width:360,text:'continue_with'});};document.head.appendChild(script)}catch{googleUnavailable.hidden=false}}
form.onsubmit=async e=>{e.preventDefault();const business=businessName.value.trim(),email=document.querySelector('#email').value.trim(),ownerName=document.querySelector('#ownerName').value.trim();if(!business||!email||!ownerName){show('Complete all fields.',true);return}btn.disabled=true;btn.textContent='Creating workspace…';try{const r=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName,ownerName,email})});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Unable to create workspace');finish(d)}catch(err){show(err.message,true)}finally{btn.disabled=false;btn.textContent='Start Free Early Access'}};
loadGoogle();
</script></body></html>
