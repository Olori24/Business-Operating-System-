<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Create your account</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>:root{font-family:Inter,ui-sans-serif,system-ui;color:#f4f7fb;background:#060a12}*{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:60px 22px}.card{background:#0b111d;border:1px solid #1d2a40;border-radius:20px;padding:30px}.eyebrow{color:#9d91ff;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1;letter-spacing:-.05em;margin:12px 0}p{color:#8e9bb0;line-height:1.6}.field{display:grid;gap:7px;margin-top:18px}label{font-size:12px;font-weight:750;color:#c8d1df}input{width:100%;padding:13px;border:1px solid #26364e;border-radius:10px;background:#08101b;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#f4f7fb;color:#070b12;font:inherit;font-weight:800;cursor:pointer}.google{display:flex;justify-content:center;margin:18px 0}.divider{display:flex;align-items:center;gap:10px;color:#66758d;font-size:11px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:#243249;flex:1}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#0d2b24;color:#91e8c7;font-size:13px}.error{background:#32141c;color:#ffb4c0}.toggle{text-align:center;margin-top:18px;color:#8e9bb0;font-size:13px}.toggle a{color:#a99eff;font-weight:750;cursor:pointer}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">BOS Early Access</div><h1 id="title">Create your BOS account.</h1><p id="subtitle">Sign up with Google or use your email and password.</p><div id="google" class="google"></div><div class="divider">or continue with email</div><form id="form"><div class="field" id="nameField"><label>Your name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div class="field" id="businessField"><label>Business name</label><input id="business" autocomplete="organization" placeholder="Your business"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@business.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div><button id="submit">Create Account & Start Free</button></form><div id="msg" class="msg" role="status"></div><div class="toggle"><span id="toggleText">Already have an account?</span> <a id="toggle">Sign in</a></div></section></main><script>let mode='signup';const $=id=>document.querySelector('#'+id),form=$('form'),msg=$('msg'),btn=$('submit');function show(t,e=false){msg.textContent=t;msg.className=e?'msg error':'msg';msg.style.display='block'}function setMode(m){mode=m;const s=m==='signup';$('title').textContent=s?'Create your BOS account.':'Welcome back.';$('subtitle').textContent=s?'Sign up with Google or use your email and password.':'Sign in with your BOS email and password.';$('nameField').style.display=s?'grid':'none';$('businessField').style.display=s?'grid':'none';btn.textContent=s?'Create Account & Start Free':'Sign In';$('toggleText').textContent=s?'Already have an account?':'New to BOS?';$('toggle').textContent=s?'Sign in':'Create an account';msg.style.display='none'}$('toggle').onclick=()=>setMode(mode==='signup'?'login':'signup');async function googleLogin(credential){const businessName=prompt('What is your business name?');if(!businessName?.trim())return show('Business name is required.',true);show('Signing you in with Google…');try{const r=await fetch('/api/v1/auth/google',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential,businessName:businessName.trim()})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||d?.error?.code||'Google sign-in failed');localStorage.setItem('bos_tenant_id',d.tenantId);localStorage.setItem('bos_workspace',JSON.stringify(d.workspace));location.href='/dashboard'}catch(e){show(e.message,true)}}async function initGoogle(){try{const r=await fetch('/api/v1/auth/config');const d=await r.json();if(!d.google?.enabled)return;const wait=()=>{if(window.google?.accounts?.id){window.google.accounts.id.initialize({client_id:d.google.clientId,callback:r=>googleLogin(r.credential),auto_select:false});window.google.accounts.id.renderButton($('google'),{theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:360})}else setTimeout(wait,100)};wait()}catch{}}form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{if(mode==='signup'){const r=await fetch('/api/v1/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||'Unable to create account');const o=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName:$('business').value.trim(),ownerName:$('name').value.trim(),email:$('email').value.trim()})});const od=await o.json();if(!o.ok)throw Error(od?.error?.message||'Account created, but workspace setup failed');localStorage.setItem('bos_tenant_id',od.tenantId);localStorage.setItem('bos_workspace',JSON.stringify(od.workspace));location.href='/dashboard'}else{const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d?.error?.message||'Unable to sign in');location.href='/dashboard'}}catch(err){show(err.message,true)}finally{btn.disabled=false}};initGoogle();</script></body></html>
