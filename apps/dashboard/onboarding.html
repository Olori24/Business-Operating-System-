<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS — Start Free Early Access</title><style>body{margin:0;background:#070b14;color:#e8edf7;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:620px;margin:0 auto;padding:48px 22px}.card{background:#0d1320;border:1px solid #263249;border-radius:18px;padding:28px}.eyebrow{color:#7dd3fc;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:42px;line-height:1;margin:10px 0 14px}p{color:#9aa8bd;line-height:1.55}.field{display:grid;gap:7px;margin-top:18px}label{font-size:13px;font-weight:700}input{padding:13px;border-radius:10px;border:1px solid #2b3850;background:#09111f;color:#fff;font:inherit}button{margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#07101d;font-weight:800;font-size:16px;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none;background:#103126;color:#91e8c7}.error{background:#3a1720;color:#ffb4c0}.next{display:none;margin-top:18px}.next a{color:#7dd3fc;font-weight:800}</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">BOS Early Access</div><h1>Put BOS to work.</h1><p>Create your free business workspace. Then build your first automation and connect WhatsApp when you're ready.</p><form id="form"><div class="field"><label for="businessName">Business name</label><input id="businessName" required placeholder="e.g. EasytrustMart"></div><div class="field"><label for="email">Work email</label><input id="email" type="email" required placeholder="you@business.com"></div><button id="submit">Start Free Early Access</button></form><div id="msg" class="msg" role="status"></div><div id="next" class="next"><a href="/workflows">Build your first workflow →</a></div></div></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#msg'),next=document.querySelector('#next'),btn=document.querySelector('#submit');form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Creating workspace…';try{const r=await fetch('/api/v1/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({businessName:businessName.value,email:email.value})});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||'Unable to create workspace');localStorage.setItem('bos_tenant_id',d.tenantId);localStorage.setItem('bos_workspace',JSON.stringify(d.workspace));msg.textContent='Workspace created. Your BOS early-access account is ready.';msg.style.display='block';next.style.display='block';form.style.display='none'}catch(err){msg.textContent=err.message;msg.className='msg error';msg.style.display='block'}finally{btn.disabled=false;btn.textContent='Start Free Early Access'}};</script></body></html>
