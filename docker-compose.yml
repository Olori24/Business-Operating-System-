services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bos
      POSTGRES_USER: bos
      POSTGRES_PASSWORD: bos
    ports:
      - "5432:5432"
    volumes:
      - bos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bos -d bos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://bos:bos@postgres:5432/bos
      WHATSAPP_GRAPH_VERSION: v23.0
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bos-postgres-data:
